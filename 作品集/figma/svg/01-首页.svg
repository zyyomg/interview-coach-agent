hor="middle">通用岗位</text><text x="872.0" y="481.9" font-family="Microsoft YaHei" font-size="14.5" font-weight="400" fill="#5a6473" text-anchor="middle">面试官一次只问一个问题：你答得含糊它追问，答得漂亮它换题，你随</text><text x="872.0" y="507.6" font-family="Microsoft YaHei" font-size="14.5" font-weight="400" fill="#5a6473" text-anchor="middle">时可以打断它。结束后给你一份复盘和一组数据。</text><text x="796.1" y="545.2" font-family="Microsoft YaHei" font-size="11" font-weight="400" fill="#98a1b0" text-anchor="middle">8 个话题约 10 分钟</text><text x="892.1" y="545.2" font-family="Microsoft YaHei" font-size="11" font-weight="400" fill="#98a1b0" text-anchor="middle">一场约 ¥0.03</text><text x="967.9" y="545.2" font-family="Microsoft YaHei" font-size="11" font-weight="400" fill="#98a1b0" text-anchor="middle">不需要注册</text><rect x="492.0" y="852.0" width="40.0" height="40.0" rx="20.0" fill="#ffffff"/><rect x="492.0" y="852.0" width="40.0" height="0.8" fill="#e6e8ec"/><rect x="531.5" y="852.0" width="0.8" height="40.0" fill="#e6e8ec"/><rect x="492.0" y="891.5" width="40.0" height="0.8" fill="#e6e8ec"/><rect x="492.5" y="852.0" width="0.8" height="40.0" fill="#e6e8ec"/><g transform="translate(501.0,861.0) scale(0.9167) translate(0,0)" fill="none" stroke="#98A1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
